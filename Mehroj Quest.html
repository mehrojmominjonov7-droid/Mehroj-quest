<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mehroj Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Onest:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1ECFF;--card:#fff;--ink:#1B1340;--mute:#645B8C;--line:#DDD5F7;--pur:#6B3FE0;--yel:#FFC93C;--blue:#3D7BFF;--good:#12B796;--bad:#E5484D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150F33;--card:#211848;--ink:#F2EEFF;--mute:#A99FD6;--line:#352A6B}}
:root[data-theme="dark"]{--bg:#150F33;--card:#211848;--ink:#F2EEFF;--mute:#A99FD6;--line:#352A6B}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Onest,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:18px 16px 48px}
h1,h2,.q{font-family:"Bricolage Grotesque",Onest,system-ui,sans-serif;margin:0}
h1{font-size:clamp(34px,9vw,52px);font-weight:800;line-height:1;letter-spacing:-1px}
h1 span{display:inline-block;background:var(--yel);color:#1B1340;padding:0 10px;border-radius:12px;transform:rotate(-2deg)}
h2{font-size:20px;font-weight:800;margin-bottom:8px}
.sub{color:var(--mute);margin:4px 0 0;font-size:15px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:12px 16px;cursor:pointer;background:var(--pur);color:#fff;min-height:48px}
button:disabled{cursor:default;opacity:.6}
button.pri{background:var(--yel);color:#1B1340;width:100%;font-size:18px;box-shadow:0 4px 0 #C99A12}
button:active:not(:disabled){transform:translateY(2px)}
input{font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-height:48px;margin-top:8px}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pick button{background:var(--bg);color:var(--ink);border:2px solid var(--line);min-height:48px;padding:6px 12px;font-size:15px}
.pick button.on{border-color:var(--pur);outline:2px solid var(--pur)}
.pick.av button{font-size:26px;padding:4px 10px}
.prev{font-size:56px;text-align:center;margin-top:8px;min-height:80px}
.err{color:var(--bad);font-weight:600;min-height:24px;margin-top:8px}
.hud{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.pill{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:4px 14px;font-weight:600}
.gold{color:#B27F00}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .gold{color:var(--yel)}}
:root[data-theme="dark"] .gold{color:var(--yel)}
.tbar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.tbar i{display:block;height:100%;width:100%;background:var(--good);transition:width .1s linear}
.q{background:var(--pur);color:#fff;border-radius:18px;padding:22px 18px;margin-top:12px;font-size:clamp(20px,5vw,26px);font-weight:800;line-height:1.25}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ans button{min-height:84px;font-size:17px;text-align:left;display:flex;gap:8px;align-items:center;color:#fff}
.ans button:nth-child(1){background:#E0457B}.ans button:nth-child(2){background:#2F6BEA}
.ans button:nth-child(3){background:#9A6E00}.ans button:nth-child(4){background:#0E9A7E}
.ans button.good{outline:4px solid var(--good);outline-offset:2px;opacity:1}
.ans button.bad{outline:4px solid var(--bad);outline-offset:2px;opacity:1}
.ans button.dim{opacity:.35}
.chests{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.chest{min-height:120px;font-size:46px;background:var(--card);color:var(--ink);border:3px dashed var(--yel);display:grid;place-items:center;padding:8px}
.chest small{font-size:14px;font-weight:600;display:block;line-height:1.2;text-align:center}
.chest.open{border-style:solid}
.msg{margin-top:12px;font-weight:600;min-height:28px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row.me{font-weight:800}
.hide{display:none!important}
.av{display:inline-block;line-height:1;font-size:1.3em;vertical-align:middle;margin-right:6px}
.a-bounce{animation:bn 1s ease-in-out infinite}@keyframes bn{50%{transform:translateY(-6px)}}
.a-wiggle{animation:wg .8s ease-in-out infinite}@keyframes wg{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.a-spin{animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.a-pulse{animation:pl 1.2s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.28)}}
.a-float{animation:fl 2s ease-in-out infinite}@keyframes fl{50%{transform:translate(4px,-5px) rotate(6deg)}}
@media(max-width:420px){.ans{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.av{animation:none!important}.tbar i{transition:none}button:active:not(:disabled){transform:none}}
</style>
</head>
<body>
<main>
  <h1>Mehroj <span>Quest</span></h1>
  <p class="sub" id="mode">Ulanmoqda…</p>

  <section class="card" id="login">
    <h2 id="loginT">Kirish</h2>
    <p class="sub" id="loginS">Birinchi marta kirsangiz, akkaunt yaratiladi. Keyingi safar shu parol bilan kirasiz.</p>
    <input id="nick" maxlength="14" placeholder="Laqabingiz" autocomplete="off">
    <input id="pw" type="password" placeholder="Parol (kamida 4 belgi)" autocomplete="off">
    <div class="sub" style="margin-top:12px">Qahramoningizni tanlang:</div>
    <div class="pick av" id="avs"></div>
    <div class="pick" id="ans"></div>
    <div class="prev" id="prev"></div>
    <div class="err" id="err" aria-live="polite"></div>
    <button class="pri" id="go" disabled>Kirish</button>
  </section>

  <section id="play" class="hide">
    <div class="hud"><span class="pill" id="who"></span><span class="pill">Savol <b id="qn">1</b>/12</span><span class="pill">🔥 <b id="st">0</b></span><span class="pill gold">🪙 <b id="gd">0</b></span></div>
    <div class="tbar"><i id="tb"></i></div>
    <div id="view"></div>
    <div class="msg" id="msg" aria-live="polite"></div>
  </section>

  <section class="card hide" id="end">
    <h2 id="endT"></h2>
    <p class="sub" id="endS"></p>
    <p><button class="pri" id="again">Qayta o'ynash</button></p>
  </section>

  <section class="card">
    <h2>Reyting</h2>
    <div id="board"></div>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show=(id,on)=>$(id).classList.toggle('hide',!on);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const ROUNDS=12,TIME=15000;
const AV=['🦁','🐯','🐼','🦊','🐸','🐙','🦄','🐲','🤖','👽','🥷','🧙'];
const AN=[['bounce','Sakrash'],['wiggle','Chayqalish'],['spin','Aylanish'],['pulse','Urish'],['float','Suzish']];
const avh=(av,an)=>'<span class="av a-'+(AN.some(x=>x[0]===an)?an:'bounce')+'">'+(AV[av]||'🙂')+'</span>';

// Savollar: asosan jiddiy, bir nechtasi hazil
const Q=[
["Amir Temur davlatining poytaxti qaysi shahar edi?",["Buxoro","Samarqand","Xiva","Toshkent"],1],
["Al-Xorazmiy kitobidagi «al-jabr» so'zidan qaysi fan nomi kelib chiqqan?",["Algebra","Geometriya","Kimyo","Astronomiya"],0],
["Mirzo Ulug'bek rasadxonasi qaysi shaharda qurilgan?",["Buxoro","Termiz","Samarqand","Qarshi"],2],
["Ibn Sinoning mashhur tibbiy asari qaysi?",["Boburnoma","Tib qonunlari","Xamsa","Mantiq ut-tayr"],1],
["«Boburnoma» muallifi kim?",["Alisher Navoiy","Amir Temur","Mirzo Ulug'bek","Zahiriddin Muhammad Bobur"],3],
["Navoiyning «Xamsa» asari nechta dostondan iborat?",["3","5","7","12"],1],
["Samarqanddagi Bibixonim masjidi kimning buyrug'i bilan qurilgan?",["Amir Temur","Bobur","Ulug'bek","Shayboniyxon"],0],
["O'zbekiston Konstitutsiyasi qaysi yilda qabul qilingan?",["1991","1992","1995","2000"],1],
["O'zbekiston davlat bayrog'ida nechta yulduz bor?",["5","9","12","16"],2],
["Maydoni bo'yicha O'zbekistonning eng katta viloyati qaysi?",["Surxondaryo","Navoiy","Samarqand","Farg'ona"],1],
["Orol dengizi qurishining asosiy sababi nima?",["Yog'ingarchilik kamayishi","Daryolar suvining sug'orishga ko'p olinishi","Zilzila","Shamol"],1],
["Dunyodagi eng baland tog' cho'qqisi qaysi?",["Elbrus","Kilimanjaro","Everest","Mon-Blan"],2],
["Suv molekulasining kimyoviy formulasi qanday?",["CO2","H2O","O2","NaCl"],1],
["O'simliklar fotosintez uchun qaysi gazni yutadi?",["Kislorod","Azot","Karbonat angidrid","Vodorod"],2],
["Kattalar tanasida nechta suyak bor?",["106","206","306","406"],1],
["Odam birinchi marta Oyga qaysi yilda qadam qo'ygan?",["1957","1961","1969","1975"],2],
["Ikkinchi jahon urushi qaysi yilda tugagan?",["1939","1943","1945","1950"],2],
["Elektr tok kuchi qaysi birlikda o'lchanadi?",["Volt","Amper","Vatt","Om"],1],
["Davriy jadvalni yaratgan olim kim?",["Nyuton","Eynshteyn","Mendeleyev","Tesla"],2],
["«WWW» qisqartmasi nimani anglatadi?",["World Wide Web","Wide World Window","Web Work World","World Web Wire"],0],
["Dadash kim?",["Qo'shni","Oilada «Dadash, bir qarab bering» deb eng ko'p chaqiriladigan odam","Mehmon","Shifokor"],1],
["Dadashning cho'ntagida odatda nima topiladi?",["Qo'shimcha pul","Hamma uchun zaryadka","Uyning barcha kalitlari","Boshqalarning topshiriqlari"],3],
["Palov tayyor bo'lganda mehmonlar soni qanday o'zgaradi?",["Kamayadi","O'zgarmaydi","Sirli ravishda ikki baravar bo'ladi","Hamma dietaga o'tadi"],2]];

// Laqabga qarab kulgili savollar
const NT=[
n=>[n+" «hozir chiqdim» desa, aslida u qayerda?",["Ko'chada","Taksida","Hali dushda","Allaqachon yetib kelgan"],2],
n=>[n+" «5 daqiqa dam olaman» deb yotsa, qachon turadi?",["5 daqiqadan keyin","3 soatdan keyin","Ertalab","Hech qachon"],1],
n=>["Agar "+n+" dasturchi bo'lsa, uning kodidagi eng ko'p izoh qaysi?",["Bu nima qiladi?","«Ishlayapti, tegmang»","Muallif: Hech kim","Keyinroq tuzataman"],1],
n=>[n+" palovga mehmon bo'lib borsa, birinchi nima qiladi?",["Salom beradi","Qozonga bir qarab oladi","Dasturxon yig'adi","Hammaga suzib beradi"],1],
n=>[n+" lotereyadan million yutsa, qanday bo'ladi?",["Hamma bilib qoladi","Hech kim bilmaydi","Faqat do'stlari bilmay qoladi","Bir soatda hamma «qarindosh» bo'ladi"],3],
n=>["Qaysi super kuch "+n+"ga eng mos?",["Uchish","Ko'rinmas bo'lish","Kech qolib, baribir birinchi kelish","Vaqtni to'xtatish"],2]];

const BOTS=()=>[{id:'b1',name:'Bobo',av:8,an:'bounce',gold:rnd(60,160)},{id:'b2',name:'Madina',av:7,an:'spin',gold:rnd(60,160)},{id:'b3',name:'Zuhra',av:6,an:'pulse',gold:rnd(60,160)}];

let db=null,uid=null,useDb=false,others=BOTS(),G=null,P=null,known=0,timer=null,busy=false,selAv=0,selAn='bounce',acct=null;

// ----- parol va akkaunt -----
async function sha(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mq:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=0;for(const c of 'mq:'+s)h=(h*31+c.charCodeAt(0))|0;return 'f'+h}
}
const authRef=()=>db.doc('data/users/'+uid+'/auth');
async function authGet(){
  try{
    if(useDb){const s=await authRef().get();return s.exists?s.data():null}
    const v=localStorage.getItem('mq-auth');return v?JSON.parse(v):null;
  }catch(e){return null}
}
async function authSet(a){
  try{if(useDb)await authRef().set(a);else localStorage.setItem('mq-auth',JSON.stringify(a))}catch(e){}
}

async function init(){
  try{
    if(window.claude&&claude.use){
      const [u,d]=await Promise.all([claude.use('user'),claude.use('db')]);
      if(u&&d){uid=await u.id();const cw=await u.can('data.write');if(uid&&cw!==false){db=d;useDb=true}}
    }
  }catch(e){}
  if(useDb){
    others=[];
    db.collection('mq').onSnapshot(s=>{
      const now=Date.now();
      others=s.docs.filter(x=>x.id!==uid).map(x=>({id:x.id,...x.data()})).filter(p=>now-(p.ts||0)<600000);
      const mine=s.docs.find(x=>x.id===uid);
      if(mine&&G&&mine.data().gold<known){
        const lost=known-mine.data().gold;G.gold=known=mine.data().gold;hud();
        $('msg').textContent='😱 Kimdir sizdan '+lost+' oltin o\'g\'irladi!';
      }
      board();
    },()=>{useDb=false;others=BOTS();mode();board()});
  }
  acct=await authGet();
  if(acct){
    $('loginT').textContent='Xush kelibsiz, '+acct.nick+'!';
    $('loginS').textContent='Davom etish uchun parolingizni kiriting.';
    $('nick').value=acct.nick;$('nick').disabled=true;$('pw').placeholder='Parol';
    selAv=acct.av||0;selAn=acct.an||'bounce';
  }
  pickers();mode();board();$('go').disabled=false;
}
const mode=()=>{$('mode').textContent=useDb?'🟢 Jonli rejim: sahifadagi do\'stlar bilan birga':'🤖 Yakka rejim: botlar bilan (do\'stlar bilan o\'ynash uchun sahifaga tahrirlash huquqi bilan kiring)'};

function pickers(){
  $('avs').innerHTML=AV.map((e,i)=>'<button type="button" data-i="'+i+'" class="'+(i===selAv?'on':'')+'" aria-label="Qahramon '+(i+1)+'">'+e+'</button>').join('');
  $('ans').innerHTML=AN.map(a=>'<button type="button" data-a="'+a[0]+'" class="'+(a[0]===selAn?'on':'')+'">'+a[1]+'</button>').join('');
  $('prev').innerHTML=avh(selAv,selAn);
  $('avs').querySelectorAll('button').forEach(b=>b.onclick=()=>{selAv=+b.dataset.i;pickers()});
  $('ans').querySelectorAll('button').forEach(b=>b.onclick=()=>{selAn=b.dataset.a;pickers()});
}
const err=t=>{$('err').textContent=t};

$('go').onclick=async()=>{
  err('');
  const pw=$('pw').value,nick=$('nick').value.trim().slice(0,14);
  if(!nick)return err('Laqabingizni kiriting.');
  if(pw.length<4)return err('Parol kamida 4 belgidan iborat bo\'lsin.');
  $('go').disabled=true;
  const h=await sha(pw);
  if(acct){
    if(acct.h!==h){$('go').disabled=false;return err('Parol noto\'g\'ri.')}
    if(acct.av!==selAv||acct.an!==selAn){acct={...acct,av:selAv,an:selAn};await authSet(acct)}
  }else{
    if(others.some(p=>String(p.name).toLowerCase()===nick.toLowerCase())){$('go').disabled=false;return err('Bu laqab band, boshqasini tanlang.')}
    acct={nick,h,av:selAv,an:selAn};await authSet(acct);
  }
  P={name:acct.nick,av:acct.av,an:acct.an};
  $('go').disabled=false;$('pw').value='';
  startGame();
};
$('again').onclick=startGame;

async function startGame(){
  const names=[...new Set([...others.map(p=>p.name),P.name])].filter(Boolean);
  const nq=shuf(names).slice(0,4).map(n=>NT[rnd(0,NT.length-1)](n));
  const deck=shuf([...shuf(Q).slice(0,ROUNDS-nq.length),...nq]);
  G={...P,gold:0,streak:0,qi:0,right:0,deck};
  if(!useDb)others=BOTS();
  $('who').innerHTML=avh(P.av,P.an)+esc(P.name);
  show('login',false);show('end',false);show('play',true);
  await sync();board();nextQ();
}
async function sync(){
  known=G.gold;
  if(!useDb)return;
  try{await db.doc('mq/'+uid).set({name:G.name,av:G.av,an:G.an,gold:G.gold,ts:Date.now()})}catch(e){}
}
const hud=()=>{$('gd').textContent=G.gold;$('st').textContent=G.streak;$('qn').textContent=Math.min(G.qi+1,ROUNDS)};
function board(){
  const list=others.map(p=>({name:p.name,gold:p.gold,av:p.av,an:p.an,me:false}));
  if(G)list.push({name:G.name+' (siz)',gold:G.gold,av:G.av,an:G.an,me:true});
  list.sort((a,b)=>b.gold-a.gold);
  $('board').innerHTML=list.length?list.slice(0,8).map((p,i)=>'<div class="row'+(p.me?' me':'')+'"><span>'+(i+1)+'. '+avh(p.av,p.an)+esc(p.name)+'</span><span class="gold">🪙 '+p.gold+'</span></div>').join(''):'<p class="sub">Hozircha hech kim yo\'q. Birinchi bo\'ling!</p>';
}

function nextQ(){
  if(G.qi>=ROUNDS)return finish();
  busy=false;hud();$('msg').textContent='';
  const q=G.deck[G.qi],opts=shuf(q[1].map((t,i)=>[t,i===q[2]]));
  $('view').innerHTML='<div class="q">'+esc(q[0])+'</div><div class="ans">'+opts.map((o,i)=>'<button><b>'+'▲◆●■'[i]+'</b> '+esc(o[0])+'</button>').join('')+'</div>';
  const bs=[...$('view').querySelectorAll('.ans button')];
  bs.forEach((b,i)=>b.onclick=()=>answer(i,opts,bs));
  const t0=Date.now();clearInterval(timer);
  timer=setInterval(()=>{
    const left=Math.max(0,TIME-(Date.now()-t0));
    $('tb').style.width=left/TIME*100+'%';
    if(left<=0){clearInterval(timer);answer(-1,opts,bs)}
  },100);
}
function answer(i,opts,bs){
  if(busy)return;busy=true;clearInterval(timer);
  const ok=i>=0&&opts[i][1];
  bs.forEach((b,k)=>{b.disabled=true;if(opts[k][1])b.classList.add('good');else if(k===i)b.classList.add('bad');else b.classList.add('dim')});
  if(ok){
    G.streak++;G.right++;
    const bonus=10+G.streak*5;G.gold+=bonus;hud();
    $('msg').textContent='✅ To\'g\'ri! +'+bonus+' oltin (seriya 🔥'+G.streak+')';
    sync();setTimeout(chests,1100);
  }else{
    G.streak=0;hud();
    $('msg').textContent=i<0?'⏰ Vaqt tugadi!':'❌ Afsus, to\'g\'ri javob yashil rangda.';
    setTimeout(()=>{G.qi++;botsMove();nextQ()},1700);
  }
}
const POOL=[['gold',30],['big',22],['jack',6],['steal',20],['lose',12],['boost',10]];
function pickType(){let r=rnd(1,100),s=0;for(const[t,w]of POOL){s+=w;if(r<=s)return t}return 'gold'}
function chests(){
  const types=[pickType(),pickType(),pickType()];
  $('view').innerHTML='<div class="q">Sandiq tanlang! 🎁</div><div class="chests">'+types.map((_,i)=>'<button class="chest" aria-label="Sandiq '+(i+1)+'">🎁</button>').join('')+'</div>';
  $('msg').textContent='Ichida nima bor? Oltin, jackpot… yoki o\'g\'ri!';
  const cs=[...$('view').querySelectorAll('.chest')];
  cs.forEach((c,i)=>c.onclick=async()=>{
    if(busy)return;busy=true;
    cs.forEach(x=>x.disabled=true);c.classList.add('open');
    const r=await apply(types[i]);
    c.innerHTML='<span>'+r.icon+'<small>'+esc(r.short)+'</small></span>';
    $('msg').textContent=r.text;hud();board();await sync();
    setTimeout(()=>{G.qi++;botsMove();nextQ()},2200);
  });
}
async function apply(t){
  if(t==='gold'){const a=rnd(30,80);G.gold+=a;return{icon:'🪙',short:'+'+a,text:'🪙 Sandiqdan '+a+' oltin chiqdi!'}}
  if(t==='big'){const a=rnd(100,180);G.gold+=a;return{icon:'💰',short:'+'+a,text:'💰 Katta xazina: +'+a+' oltin!'}}
  if(t==='jack'){G.gold+=300;return{icon:'🎰',short:'+300',text:'🎰 JACKPOT! +300 oltin!'}}
  if(t==='boost'){const a=Math.max(25,Math.floor(G.gold*.25));G.gold+=a;return{icon:'🚀',short:'+25%',text:'🚀 Oltiningiz 25% ga oshdi: +'+a+'!'}}
  if(t==='lose'){const a=Math.floor(G.gold*.2);G.gold-=a;return{icon:'🕳️',short:'-'+a,text:'🕳️ Teshik sandiq! '+a+' oltin tushib ketdi.'}}
  const cands=others.filter(p=>p.gold>=30);
  if(!cands.length){G.gold+=40;return{icon:'🦹',short:'+40',text:'🦹 O\'g\'irlash uchun hech kim yo\'q, lekin 40 oltin topdingiz.'}}
  const v=cands[rnd(0,cands.length-1)];let a=Math.max(10,Math.floor(v.gold*.2));
  if(useDb&&!String(v.id).startsWith('b')){
    try{const s=await db.doc('mq/'+v.id).get();if(s.exists){const vg=s.data().gold;a=Math.min(Math.max(10,Math.floor(vg*.2)),vg);await db.doc('mq/'+v.id).update({gold:vg-a})}}catch(e){a=0}
  }else v.gold=Math.max(0,v.gold-a);
  G.gold+=a;
  return{icon:'🦹',short:'+'+a,text:'🦹 '+v.name+'dan '+a+' oltin o\'g\'irladingiz! 😈'};
}
function botsMove(){
  if(useDb)return;
  others.forEach(b=>b.gold+=rnd(0,70));
  if(Math.random()<.2&&G.gold>=30){
    const a=Math.floor(G.gold*.1),b=others[rnd(0,others.length-1)];G.gold-=a;b.gold+=a;known=G.gold;
    $('msg').textContent='😱 '+b.name+' sizdan '+a+' oltin o\'g\'irladi!';
  }
}
function finish(){
  clearInterval(timer);show('play',false);show('end',true);
  const list=[...others.map(p=>p.gold),G.gold].sort((a,b)=>b-a),rank=list.indexOf(G.gold)+1;
  $('endT').textContent=rank===1?'🏆 Siz birinchisiz!':'O\'yin tugadi!';
  $('endS').textContent=G.right+'/'+ROUNDS+' to\'g\'ri javob · '+G.gold+' oltin · reytingda '+rank+'-o\'rin';
  sync();board();
}
pickers();init();
</script>
